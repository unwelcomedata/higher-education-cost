project_name: "higher-education-cost"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # URLs below were confirmed live on 2026-09-30 during 01-ingest (see the
  # notebook for the verification of each). All three sources are U.S. federal
  # government works in the public domain. Raw files land in data/raw/ verbatim.

  # --- IPEDS (NCES) — authoritative source for tuition + finance -------------
  # Complete data files: https://nces.ed.gov/ipeds/datacenter/DataFiles.aspx
  # Stable per-survey, per-year ZIP-of-CSV pattern (confirmed 200 for each file
  # stem below):  https://nces.ed.gov/ipeds/datacenter/data/<SURVEY_FILE>.zip
  #
  # Two collection years are pulled to enable the over-time story:
  #   2012 (2011-12 collection) and 2022 (2021-22 collection) — a full decade.
  # CRITICAL: the Finance (F) survey is split by accounting standard —
  #   *_F1A = GASB (public institutions), *_F2 = FASB (private nonprofit).
  #   The two use DIFFERENT expense-function categories and do NOT map 1:1;
  #   they are kept as SEPARATE raw tables and must never be summed together.
  ipeds:
    base_url: "https://nces.ed.gov/ipeds/datacenter/data"
    type: zip_csv
    js_render: false
    survey_files:
      # <survey_file>: <what it is> — DuckDB table it lands in
      HD2022:     "Institutional Characteristics header (state/sector/level/Carnegie), 2021-22"   # ipeds_hd_2022_raw
      HD2012:     "Institutional Characteristics header, 2011-12"                                  # ipeds_hd_2012_raw
      IC2022_AY:  "Charges — published tuition & required fees (sticker), academic-year, 2021-22"  # ipeds_charges_2022_raw
      IC2012_AY:  "Charges — published tuition & required fees (sticker), academic-year, 2011-12"  # ipeds_charges_2012_raw
      F2122_F1A:  "Finance GASB (public) — expenses by function, FY2021-22"                        # ipeds_finance_gasb_2022_raw
      F1112_F1A:  "Finance GASB (public) — expenses by function, FY2011-12"                        # ipeds_finance_gasb_2012_raw
      F2122_F2:   "Finance FASB (private nonprofit) — expenses by function, FY2021-22"             # ipeds_finance_fasb_2022_raw
      F1112_F2:   "Finance FASB (private nonprofit) — expenses by function, FY2011-12"             # ipeds_finance_fasb_2012_raw
      EFFY2022:   "12-month unduplicated enrollment (for per-FTE normalization), 2021-22"          # ipeds_enrollment_2022_raw
      EFFY2012:   "12-month unduplicated enrollment (for per-FTE normalization), 2011-12"          # ipeds_enrollment_2012_raw

  # --- College Scorecard (U.S. Dept. of Education) — modern cost + outcomes ---
  # Bulk data page: https://collegescorecard.ed.gov/data/
  # Bulk host moved from ed-public-download.app.cloud.gov (now 404) to the
  # scorecard.network host below (resolved 2026-09-30 via the data.ed.gov CKAN
  # package listing). "Most Recent Institution-Level Data" = one CSV, every
  # Title IV institution's latest cohort (net price, cost of attendance,
  # completion, earnings).
  scorecard:
    url: "https://ed-public-download.scorecard.network/downloads/Most-Recent-Cohorts-Institution_05192025.zip"
    type: zip_csv
    js_render: false

  # --- BLS CPI-U — inflation adjustment --------------------------------------
  # NOTE: the flat-file host https://download.bls.gov/pub/time.series/cu/ returns
  # a 403 Akamai block page to automated GETs (confirmed 2026-09-30, even with a
  # full browser header set), so CPI-U is pulled from the BLS public timeseries
  # API instead. Keyless for modest use; an optional BLS_API_KEY in .env (which
  # is gitignored) raises the rate limits but is not required.
  cpi_u:
    api_url: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
    type: bls_api
    series:
      CUUR0000SA0:     "CPI-U, All Items, U.S. city average, not seasonally adjusted"
      CUUR0000SEEB01:  "CPI-U, College tuition and fees subindex, U.S. city average, NSA"
    start_year: 2000
    end_year:   2024

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
